# PostgreSQL de développement local (pnpm db:up / pnpm db:down).
# Identifiants alignés sur apps/api/.env.example ; développement uniquement.
# Alternative sans Docker : pnpm db:local (voir README).
services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: netforge
      POSTGRES_PASSWORD: netforge_dev
      POSTGRES_DB: netforge
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - netforge-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netforge -d netforge"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  netforge-db:
