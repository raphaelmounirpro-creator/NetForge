# Intégration continue minimale de NetForge.
# Actions épinglées par SHA de commit (version indiquée en commentaire).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PRISMA_HIDE_UPDATE_MESSAGE: "1"

jobs:
  check:
    name: Lint, types, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (version lue dans packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  database:
    name: Migrations et préparation de l'API (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: netforge
          POSTGRES_PASSWORD: netforge_ci
          POSTGRES_DB: netforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netforge -d netforge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Base éphémère du job, sans donnée réelle.
      DATABASE_URL: postgresql://netforge:netforge_ci@localhost:5432/netforge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Appliquer les migrations
        run: pnpm db:migrate
      - name: Vérifier l'état des migrations
        run: pnpm --filter @netforge/api db:status
      - name: Construire l'API
        run: pnpm build:packages && pnpm --filter @netforge/api build
      - name: Démarrer l'API et vérifier /api/health/ready
        working-directory: apps/api
        run: |
          node dist/main.js > api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health/ready; then
              echo
              exit 0
            fi
            sleep 1
          done
          cat api.log
          exit 1
